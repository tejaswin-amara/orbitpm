openapi: 3.1.0
info:
  title: OrbitPM API
  version: 0.1.0
  description: JSON API for OrbitPM project management.
  contact:
    name: OrbitPM Support
    url: https://github.com/tejaswin-amara/orbitpm
tags:
  - name: System
    description: System health and operational endpoints
  - name: Projects
    description: Project management operations
  - name: Tasks
    description: Task tracking and status operations
  - name: Comments
    description: Discussions and project comment operations
servers:
  - url: https://example.vercel.app
paths:
  /api/health:
    get:
      summary: Health check
      description: Check the database and system health status.
      operationId: getHealthStatus
      tags: [System]
      responses:
        "200": { description: Healthy }
        "503": { description: Degraded }
  /api/projects:
    get:
      summary: List projects
      description: Retrieve list of projects available to the authenticated user.
      operationId: listProjects
      tags: [Projects]
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: Project list }
        "401": { description: Unauthorized }
    post:
      summary: Create project
      description: Create a new project.
      operationId: createProject
      tags: [Projects]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProject" }
      responses:
        "201": { description: Created }
        "401": { description: Unauthorized }
        "422": { description: Validation error }
  /api/projects/{projectId}:
    parameters: [{ $ref: "#/components/parameters/projectId" }]
    get:
      summary: Get project
      description: Retrieve details of a specific project.
      operationId: getProjectById
      tags: [Projects]
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: Project }
        "404": { description: Not found }
    patch:
      summary: Update project
      description: Update properties of an existing project.
      operationId: updateProjectById
      tags: [Projects]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProject" }
      responses:
        "200": { description: Updated }
        "403": { description: Forbidden }
        "404": { description: Not found }
  /api/projects/{projectId}/tasks:
    parameters: [{ $ref: "#/components/parameters/projectId" }]
    get:
      summary: List project tasks
      description: Retrieve all tasks associated with a given project.
      operationId: listProjectTasks
      tags: [Tasks]
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Task list } }
    post:
      summary: Create task
      description: Create a new task within a specific project.
      operationId: createTaskInProject
      tags: [Tasks]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTask" }
      responses:
        "201": { description: Created }
        "422": { description: Validation error }
  /api/tasks/{taskId}:
    parameters: [{ $ref: "#/components/parameters/taskId" }]
    patch:
      summary: Update task
      description: Update status, priority, or fields of an existing task.
      operationId: updateTaskById
      tags: [Tasks]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTask" }
      responses: { "200": { description: Updated } }
    delete:
      summary: Delete task
      description: Remove a task by its identifier.
      operationId: deleteTaskById
      tags: [Tasks]
      security: [{ cookieAuth: [] }]
      responses:
        "204": { description: Deleted }
        "403": { description: Forbidden }
  /api/projects/{projectId}/comments:
    parameters: [{ $ref: "#/components/parameters/projectId" }]
    post:
      summary: Add project comment
      description: Post a comment on a project.
      operationId: createProjectComment
      tags: [Comments]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses: { "201": { description: Created } }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    taskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
  schemas:
    CreateProject:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        targetDate: { type: string, format: date }
    UpdateProject:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        description: { type: string, maxLength: 500, nullable: true }
        status:
          type: string
          enum: [PLANNING, ACTIVE, ON_HOLD, COMPLETED, ARCHIVED]
        targetDate: { type: string, format: date, nullable: true }
    CreateTask:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 2, maxLength: 140 }
        description: { type: string, maxLength: 2000 }
        status: { type: string, enum: [TODO, IN_PROGRESS, REVIEW, DONE] }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT] }
        dueDate: { type: string, format: date }
    UpdateTask:
      type: object
      properties:
        title: { type: string, minLength: 2, maxLength: 140 }
        description: { type: string, maxLength: 2000, nullable: true }
        status: { type: string, enum: [TODO, IN_PROGRESS, REVIEW, DONE] }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT] }
        dueDate: { type: string, format: date, nullable: true }
        assigneeId: { type: string, nullable: true }
