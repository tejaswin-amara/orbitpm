name: Lockfile Refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.9.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Normalize existing lockfile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("pnpm-lock.yaml")
          text = path.read_text()
          documents = [part for part in text.split("\n---\n") if part.strip()]
          if len(documents) > 1:
              path.write_text("---\n" + documents[-1].lstrip() + "\n")
          PY

      - name: Refresh lockfile
        run: pnpm install --lockfile-only

      - name: Allow required build scripts for audit remediation
        shell: bash
        run: |
          cat > pnpm-workspace.yaml <<'EOF'
          packages:
            - "."
          allowBuilds:
            "@prisma/engines": true
            "@scarf/scarf": false
            esbuild: true
            lefthook: true
            prisma: true
          EOF

      - name: Apply pnpm security fixes
        shell: bash
        env:
          pnpm_config_ignore_scripts: "false"
        run: |
          pnpm audit --fix

      - name: Refresh lockfile after security fix
        run: pnpm install --lockfile-only

      - name: Verify production audit
        shell: bash
        run: |
          pnpm audit --prod

      - name: Finalize workspace policy
        shell: bash
        run: |
          cat >> pnpm-workspace.yaml <<'EOF'
          nodeLinker: hoisted
          ignoreScripts: true
          minimumReleaseAge: 10080
          EOF

      - name: Commit dependency remediation
        if: github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml pnpm-workspace.yaml
          git add -u .github/workflows/lockfile-refresh.yml
          git rm -f .github/workflows/lockfile-refresh.yml
          if git diff --cached --quiet; then
            echo "No dependency remediation changes to commit."
            exit 0
          fi
          git commit -m "fix(deps): remediate audited dependency graph"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Upload dependency remediation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-pnpm-security-remediation
          path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
          if-no-files-found: error
