name: Lockfile Refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.9.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Normalize existing lockfile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("pnpm-lock.yaml")
          text = path.read_text()
          documents = [part for part in text.split("\n---\n") if part.strip()]
          if len(documents) > 1:
              path.write_text("---\n" + documents[-1].lstrip() + "\n")
          PY

      - name: Refresh lockfile
        run: pnpm install --lockfile-only

      - name: Allow required build scripts for audit remediation
        shell: bash
        run: |
          cat > pnpm-workspace.yaml <<'EOF'
          packages:
            - "."
          allowBuilds:
            "@prisma/engines": true
            "@scarf/scarf": false
            esbuild: true
            lefthook: true
            prisma: true
          EOF

      - name: Apply pnpm security fixes
        shell: bash
        env:
          pnpm_config_ignore_scripts: "false"
        run: |
          pnpm audit --fix=update

      - name: Refresh lockfile after security fix
        run: pnpm install --lockfile-only

      - name: Verify production audit
        shell: bash
        run: |
          pnpm audit --prod

      - name: Remove temporary workspace policy
        shell: bash
        run: rm -f pnpm-workspace.yaml

      - name: Upload lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
