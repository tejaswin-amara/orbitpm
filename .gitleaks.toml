[extend]
useDefault = true

[allowlist]
description = "Allowlist CI template expressions and intentionally dummy Better Auth test secrets."
regexTarget = "match"
regexes = [
  '''\$\{\{\s*secrets\.[A-Z0-9_]+\s*\}\}''',
  '''abcdefghijklmnopqrstuvwxyz123456''',
  '''0123456789abcdef0123456789abcdef'''
]
